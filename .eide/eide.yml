version: "4.1"
name: Power-Sampler-F411
type: ARM
deviceName: STM32F411CEUx
packDir: null
srcDirs:
  - Core/Src
  - BSP/Src
  - Driver/Src
  - Service/Src
  - App/Src
  - Drivers/STM32F4xx_HAL_Driver/Src
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f411xe.s
  folders: []
dependenceList: []
outDir: build\eide
miscInfo:
  uid: power-sampler-f411-0001
targets:
  Release:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F411xE
      incList:
        - Core/Inc
        - BSP/Inc
        - Driver/Inc
        - Service/Inc
        - App/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-2
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nano.specs -u _printf_float
            output-debug-info: enable
          linker:
            LD_FLAGS: -Wl,--print-memory-usage
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F411CEUx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: stlink
        target: stm32f4x
    uploader: OpenOCD
